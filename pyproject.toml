[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sifess"
version = "0.1.0"
description = "Soft Isophote-Frame Equivariant Self-Supervision (DINO) for medical imaging"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "SIFESS Contributors" }]
keywords = ["medical-imaging", "self-supervised-learning", "DINO", "equivariance", "structure-tensor"]
dependencies = [
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "numpy>=1.23.0",
  "scipy>=1.10.0",
  "Pillow>=9.0.0",
  "PyYAML>=6.0",
  "tqdm>=4.64.0",
  "scikit-learn>=1.2.0",
  "medmnist>=3.0.0",
  "pandas>=1.5.0",
  "matplotlib>=3.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
sifess-train-ssl = "sifess.engines.train_ssl:main"
sifess-linear-probe = "sifess.engines.linear_probe:main"
sifess-eval-ood = "sifess.engines.eval_ood:main"
sifess-ablations = "sifess.engines.run_ablations:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sifess*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
